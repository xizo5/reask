<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>判分 · 回问</title>
<link rel="stylesheet" href="app.css">
<style>
  .score{
    display: flex; align-items: center; gap: 24px;
    flex: none; padding-bottom: 4px;
  }
  .score .main{ display: flex; align-items: baseline; gap: 8px; }
  .score .num{
    font-family: var(--mono); font-size: 30px; font-weight: 500;
    letter-spacing: -.02em; line-height: 1; color: var(--text);
  }
  .score .unit{ font-size: 12px; color: var(--text-3); }
  .score .tags{ display: flex; gap: 8px; }

  .offline-note{
    font-size: 11px; color: var(--warn);
    background: var(--warn-soft);
    border: 1px solid rgba(216,166,87,.25);
    border-radius: var(--r-sm);
    padding: 3px 8px;
  }

  .list{
    flex: 1; min-height: 0; overflow-y: auto;
    margin: 0 -8px; padding: 0 8px;
    display: flex; flex-direction: column;
  }
  .item{
    padding: 9px 0;
    border-bottom: 1px solid var(--line);
    display: grid; grid-template-columns: 1fr auto;
    gap: 7px 16px; align-items: start;
  }
  .item:last-child{ border-bottom: none; }
  .item .q{
    font-size: 12.5px; line-height: 1.5; font-weight: 500;
    color: var(--text); user-select: text;
  }
  .item .q .idx{
    font-family: var(--mono); font-size: 10.5px;
    color: var(--text-4); margin-right: 8px;
  }
  .item .both{
    grid-column: 1 / -1;
    display: grid; grid-template-columns: 1fr 1fr;
    gap: 14px; padding-left: 28px; margin-top: 1px;
  }
  .col .lb{
    font-size: 10.5px; font-weight: 500;
    letter-spacing: .08em; text-transform: uppercase;
    color: var(--text-3); margin-bottom: 4px;
  }
  .col p{
    font-size: 11.5px; line-height: 1.55; color: var(--text-2);
    user-select: text; white-space: pre-wrap;
  }
  .col.key p{ color: #B2BAC7; }
  .col.key .lb{ color: var(--accent); }
  .col .why{
    margin-top: 6px; font-size: 11px; color: var(--text-3);
    border-left: 2px solid var(--line-2); padding-left: 8px;
  }
  .none{ color: var(--text-4); font-style: normal; }
</style>
</head>
<body>
<div class="app">
  <div class="bar">
    <span class="dot"></span>
    <span class="title" id="barTitle">判分</span>
    <div class="right"><span class="dash"><i></i><i></i><i></i></span></div>
  </div>

  <div class="body">
    <div class="score">
      <div class="main">
        <span class="num" id="scoreNum">0</span>
        <span class="unit" id="scoreUnit">/ 0 答对</span>
      </div>
      <div class="tags" id="scoreTags"></div>
      <span id="offlineSlot"></span>
      <span class="spacer"></span>
      <button class="btn" id="btnToggle" type="button">收起详情</button>
    </div>

    <div class="list" id="list"></div>

    <div class="foot">
      <span class="hint" id="footNote"></span>
      <span class="spacer"></span>
      <button class="btn" id="btnMixed" type="button" hidden>还有大杂烩</button>
      <button class="btn btn-primary" id="btnDone" type="button">完成</button>
    </div>
  </div>
</div>
<script src="api.js"></script>
<script src="result.js"></script>
</body>
</html>
