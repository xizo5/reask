<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>全部问题 · 回问</title>
<link rel="stylesheet" href="app.css">
<style>
  .search{
    -webkit-app-region: no-drag;
    font-family: var(--font); font-size: 12px;
    background: var(--surface-2);
    border: 1px solid var(--line-2);
    border-radius: var(--r-sm);
    color: var(--text); padding: 5px 10px;
    width: 200px; outline: none;
    user-select: text;
    transition: border-color var(--dur) var(--ease), box-shadow var(--dur) var(--ease);
  }
  .search::placeholder{ color: var(--text-4); }
  .search:focus{ border-color: var(--accent-line); box-shadow: 0 0 0 3px var(--accent-soft); }

  .tabs{ display: flex; gap: 4px; flex: none; align-items: center; }
  .tab{
    font-family: var(--font); font-size: 12px;
    color: var(--text-3); background: transparent;
    border: 1px solid transparent; border-radius: var(--r-sm);
    padding: 5px 10px; cursor: pointer;
    display: flex; align-items: center; gap: 6px;
    transition: color var(--dur) var(--ease), background var(--dur) var(--ease);
  }
  .tab:hover{ color: var(--text-2); background: var(--surface-2); }
  .tab.on{ color: var(--text); background: var(--surface-3); border-color: var(--line-2); }
  .tab .n{
    font-family: var(--mono); font-size: 10.5px;
    color: var(--text-4); min-width: 12px; text-align: right;
  }
  .tab.on .n{ color: var(--accent); }

  .list{
    flex: 1; min-height: 0; overflow-y: auto;
    margin: 0 -8px; padding: 0 8px;
  }

  .row{
    padding: 11px 10px;
    border-radius: var(--r-md);
    border-bottom: 1px solid var(--line);
    cursor: pointer;
    transition: background var(--dur) var(--ease);
  }
  .row:hover{ background: var(--surface-2); }
  .row:last-child{ border-bottom: none; }

  .rowhead{ display: flex; align-items: flex-start; gap: 12px; }
  .rowhead .q{
    font-size: 13px; line-height: 1.55; font-weight: 500;
    color: var(--text); flex: 1; min-width: 0;
    user-select: text;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .row.open .rowhead .q{ -webkit-line-clamp: unset; }

  .meta{
    font-family: var(--mono); font-size: 10.5px; color: var(--text-4);
    margin-top: 5px; display: flex; gap: 8px; flex-wrap: wrap;
  }
  .meta .sep{ color: var(--line-3); }

  .detail{
    margin-top: 9px; padding-left: 10px;
    border-left: 2px solid var(--line-2);
  }
  .detail[hidden]{ display: none; }
  .detail .lb{
    font-size: 10px; font-weight: 500; letter-spacing: .08em;
    text-transform: uppercase; color: var(--text-4); margin-bottom: 4px;
  }
  .detail p{
    font-size: 12px; line-height: 1.65; color: var(--text-2);
    user-select: text; white-space: pre-wrap;
  }
  .detail p.none{ color: var(--text-4); }
  .detail .ctx{
    margin-top: 8px; font-family: var(--mono); font-size: 10.5px;
    color: var(--text-4); white-space: pre-wrap; max-height: 90px; overflow-y: auto;
  }

  .empty{
    flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 8px;
  }
  .empty[hidden]{ display: none; }
  .empty .t{ font-size: 13px; color: var(--text-2); }
  .empty .d{ font-size: 11.5px; color: var(--text-4); }
</style>
</head>
<body>
<div class="app">
  <div class="bar">
    <span class="dot"></span>
    <span class="title">全部问题</span>
    <div class="right">
      <input class="search" id="search" type="text" placeholder="搜问题、答案、来源…" spellcheck="false">
      <span class="dash"><i></i><i></i><i></i></span>
    </div>
  </div>

  <div class="body">
    <div class="tabs" id="tabs">
      <button class="tab" type="button" data-scope="today">今天 <span class="n" id="n-today">0</span></button>
      <button class="tab" type="button" data-scope="all">全部 <span class="n" id="n-all">0</span></button>
      <button class="tab" type="button" data-scope="pending">待回填 <span class="n" id="n-pending">0</span></button>
      <button class="tab" type="button" data-scope="archived">已放弃 <span class="n" id="n-archived">0</span></button>
    </div>

    <div class="list" id="list"></div>

    <div class="empty" id="empty" hidden>
      <div class="t" id="emptyTitle">这里还是空的</div>
      <div class="d" id="emptyDesc">按 Ctrl+Shift+Q 记第一条</div>
    </div>

    <div class="foot">
      <span class="hint" id="footNote"></span>
      <span class="spacer"></span>
      <button class="btn btn-primary" id="btnClose" type="button">关闭</button>
    </div>
  </div>
</div>
<script src="api.js"></script>
<script src="history.js"></script>
</body>
</html>
